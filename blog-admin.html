<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Admin - Arabic OCR</title>
    <meta name="robots" content="noindex, nofollow" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="/logo.png" alt="Logo" class="w-8 h-8">
                <span class="font-bold text-xl">Blog Admin</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="blog.html" class="text-gray-600 hover:text-amber-600 font-medium">View Blog</a>
                <div class="h-6 w-px bg-gray-200"></div>
                <button id="admin-logout-btn" class="text-red-500 hover:text-red-600 font-medium">Log Out</button>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Dashboard</h2>
                <p class="text-gray-500">Manage your blog posts, categories, and comments.</p>
            </div>
            <a href="blog-editor.html"
                class="bg-amber-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-amber-700 transition shadow-lg flex items-center justify-center">
                <i class="fas fa-plus mr-2"></i> Create New Post
            </a>
        </div>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <div
                        class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fas fa-newspaper"></i>
                    </div>
                </div>
                <h4 class="text-gray-500 text-sm font-medium">Total Posts</h4>
                <p id="stat-total-posts" class="text-2xl font-bold text-gray-900">--</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <div
                        class="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fas fa-eye"></i>
                    </div>
                </div>
                <h4 class="text-gray-500 text-sm font-medium">Total Views</h4>
                <p id="stat-total-views" class="text-2xl font-bold text-gray-900">--</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <div
                        class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fas fa-comments"></i>
                    </div>
                </div>
                <h4 class="text-gray-500 text-sm font-medium">Pending Comments</h4>
                <p id="stat-pending-comments" class="text-2xl font-bold text-gray-900">--</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <div
                        class="w-12 h-12 bg-yellow-100 text-yellow-600 rounded-xl flex items-center justify-center text-xl">
                        <i class="fas fa-users"></i>
                    </div>
                </div>
                <h4 class="text-gray-500 text-sm font-medium">Subscribers</h4>
                <p id="stat-subscribers" class="text-2xl font-bold text-gray-900">--</p>
            </div>
        </div>

        <!-- Posts Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <h3 class="font-bold text-gray-900">Recent Posts</h3>
                <div class="relative">
                    <input type="text" id="admin-search-posts" placeholder="Filter posts..."
                        class="bg-gray-50 border border-gray-200 rounded-lg py-1.5 px-3 pl-9 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-bold">
                        <tr>
                            <th class="px-6 py-3">Title</th>
                            <th class="px-6 py-3">Status</th>
                            <th class="px-6 py-3">Type</th>
                            <th class="px-6 py-3">Date</th>
                            <th class="px-6 py-3">Views</th>
                            <th class="px-6 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-posts-table" class="divide-y">
                        <!-- Posts rows injected here -->
                        <tr>
                            <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                <i class="fas fa-spinner fa-spin mr-2"></i> Loading posts...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="js/blog-admin.js"></script>
</body>

</html>
